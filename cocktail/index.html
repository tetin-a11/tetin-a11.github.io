<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCKTAIL ATLAS — 世界標準カクテル・データベース</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2077000524682922"
     crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09080b;
  --s1: #100e15;
  --s2: #181520;
  --border: rgba(255,255,255,0.07);
  --gold: #b4a06a;
  --gold2: #d4c090;
  --text: #e2ddd5;
  --muted: #6a6560;
  --muted2: #4a4540;
  --red: #b83a3a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(100,80,40,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(60,40,100,0.05) 0%,transparent 60%);pointer-events:none;z-index:0}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:rgba(9,8,11,0.94);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:1.4rem 3rem;display:flex;align-items:center;justify-content:space-between;gap:2rem}
.logo-wrap{flex-shrink:0}
.logo-en{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.4rem;letter-spacing:0.35em;color:var(--gold);text-transform:uppercase;line-height:1}
.logo-ja{font-size:0.6rem;letter-spacing:0.2em;color:var(--muted);margin-top:0.25rem;font-weight:300}
.header-search{flex:1;max-width:520px;position:relative}
.header-search input{width:100%;background:var(--s1);border:1px solid var(--border);color:var(--text);padding:0.7rem 1rem 0.7rem 2.8rem;font-family:'Noto Serif JP',serif;font-size:0.85rem;outline:none;transition:border-color 0.2s;letter-spacing:0.03em}
.header-search input:focus{border-color:var(--gold)}
.header-search input::placeholder{color:var(--muted)}
.search-ico{position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.75rem;letter-spacing:0}
.header-right{display:flex;align-items:center;gap:1.5rem;flex-shrink:0}
.stat-badge{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;text-align:right}
.stat-badge strong{color:var(--gold2);font-size:1.1em}
.settings-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.5rem 0.7rem;cursor:pointer;font-size:0.85rem;transition:all 0.15s;line-height:1}
.settings-btn:hover{color:var(--gold);border-color:var(--gold)}
.settings-btn.active{color:var(--gold);border-color:var(--gold);background:rgba(180,160,106,0.08)}

/* FILTERS */
.filters{padding:0 3rem;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-group{display:flex;align-items:center;gap:0;border-right:1px solid var(--border)}
.filter-group:last-child{border-right:none}
.fgroup-label{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.2em;color:var(--muted2);padding:0 1rem;white-space:nowrap;text-transform:uppercase}
.fbtn{background:transparent;border:none;color:var(--muted);padding:1rem 1rem;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.08em;cursor:pointer;transition:all 0.15s;white-space:nowrap;text-transform:uppercase;border-bottom:2px solid transparent}
.fbtn:hover{color:var(--gold)}
.fbtn.active{color:var(--gold);border-bottom-color:var(--gold)}

/* TOOLBAR */
.toolbar{padding:0.8rem 3rem;display:flex;align-items:center;gap:1rem;background:var(--bg)}
.result-info{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:0.1em}
.result-info strong{color:var(--gold2)}
.view-btns{margin-left:auto;display:flex;gap:2px}
.vbtn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.6rem;cursor:pointer;font-size:0.7rem;transition:all 0.15s}
.vbtn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border);padding:1px;position:relative;z-index:1}
.grid.view-list{grid-template-columns:1fr;gap:0;background:transparent;padding:0}

/* CARD */
.card{background:var(--bg);cursor:pointer;transition:background 0.2s;display:flex;flex-direction:column;overflow:hidden;animation:fadeUp 0.4s ease both}
.card:hover{background:var(--s1)}
.card:hover .card-img img{transform:scale(1.05)}
.grid.view-list .card{flex-direction:row;border-bottom:1px solid var(--border);align-items:center}

.card-img{width:100%;aspect-ratio:4/3;overflow:hidden;position:relative;flex-shrink:0}
.grid.view-list .card-img{width:80px;height:80px;aspect-ratio:1}
.card-img img{width:100%;height:100%;object-fit:contain;transition:transform 0.4s ease;display:block;background:#000}
.card-img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

.card-body{padding:1.4rem;flex:1;display:flex;flex-direction:column;gap:0.8rem}
.grid.view-list .card-body{padding:1rem 1.4rem;flex-direction:row;align-items:center;gap:2rem}

.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.card-num{font-family:'Space Mono',monospace;font-size:0.55rem;color:var(--muted2);letter-spacing:0.15em}
.card-iba{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.1em;color:var(--gold);border:1px solid rgba(180,160,106,0.4);padding:0.12rem 0.35rem}

.card-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:400;line-height:1.1;letter-spacing:0.02em}
.card-nameja{font-size:0.7rem;color:var(--muted);font-weight:300;margin-top:0.2rem}
.grid.view-list .card-name-wrap{flex:1;min-width:180px}

.card-tags{display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center}
.tag{font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.06em;padding:0.2rem 0.45rem;text-transform:uppercase}
.tag-base{background:rgba(180,160,106,0.1);color:var(--gold)}
.tag-taste{background:rgba(255,255,255,0.04);color:var(--muted)}
.tag-era{background:rgba(255,255,255,0.02);color:var(--muted2)}
.card-abv{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--muted);margin-left:auto}
.card-abv strong{color:var(--text);font-size:0.9rem}

.card-ingr{list-style:none;font-size:0.7rem;color:var(--muted);border-top:1px solid var(--border);padding-top:0.8rem}
.card-ingr li{display:flex;justify-content:space-between;padding:0.2rem 0}
.card-ingr li span:first-child{color:var(--text)}

/* MINI FLAVOR BAR */
.flavor-bars{display:flex;gap:3px;height:3px;margin-top:auto}
.fbar{flex:1;border-radius:1px;opacity:0.6}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.8);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity 0.3s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--border);max-width:780px;width:100%;max-height:90vh;overflow-y:auto;position:relative;transform:translateY(16px);transition:transform 0.3s;display:flex;flex-direction:column}
.modal-bg.open .modal{transform:translateY(0)}
.modal-close{position:absolute;top:1.2rem;right:1.2rem;background:var(--s2);border:none;color:var(--muted);font-size:0.7rem;font-family:'Space Mono',monospace;letter-spacing:0.15em;padding:0.5rem 0.8rem;cursor:pointer;z-index:10;transition:color 0.2s}
.modal-close:hover{color:var(--text)}

.modal-hero{position:relative;height:360px;overflow:hidden;flex-shrink:0;background:#000}
.modal-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--s1) 0%,transparent 100%)}

.modal-body{padding:2.5rem}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:2.6rem;font-weight:300;line-height:1;margin-bottom:0.3rem}
.modal-subtitle{font-size:0.75rem;color:var(--muted);letter-spacing:0.15em;margin-bottom:2rem;font-family:'Space Mono',monospace}

.modal-grid{display:grid;grid-template-columns:1fr 200px;gap:2.5rem}
@media(max-width:600px){.modal-grid{grid-template-columns:1fr}}

.section-label{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.25em;color:var(--gold);text-transform:uppercase;padding-bottom:0.6rem;border-bottom:1px solid var(--border);margin-bottom:1rem}

.ingr-list{list-style:none;margin-bottom:2rem}
.ingr-list li{display:flex;justify-content:space-between;padding:0.55rem 0;border-bottom:1px solid var(--border);font-size:0.82rem}
.ingr-list li span:last-child{color:var(--gold);font-family:'Space Mono',monospace;font-size:0.72rem}

.method-text{font-size:0.82rem;line-height:1.9;color:var(--muted);margin-bottom:1.5rem}
.note-text{font-size:0.8rem;line-height:1.8;color:var(--muted2);font-style:italic;padding:1rem;border-left:2px solid rgba(180,160,106,0.3);margin-bottom:1.5rem}

/* FLAVOR WHEEL */
.flavor-wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:0.8rem}
.flavor-legend{list-style:none;width:100%}
.flavor-legend li{display:flex;justify-content:space-between;font-size:0.65rem;padding:0.25rem 0;border-bottom:1px solid var(--border)}
.flavor-legend li span:first-child{color:var(--muted)}
.flavor-legend li span:last-child{color:var(--gold);font-family:'Space Mono',monospace}

/* TWEAKS PANEL */
.tweaks-panel{position:fixed;bottom:2rem;right:2rem;background:var(--s2);border:1px solid var(--border);padding:1.5rem;z-index:999;width:240px;display:none}
.tweaks-title{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.25em;color:var(--gold);margin-bottom:1rem;text-transform:uppercase}
.tweak-row{margin-bottom:1rem}
.tweak-label{font-family:'Space Mono',monospace;font-size:0.55rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:0.4rem;display:block;text-transform:uppercase}
.tweak-row select,.tweak-row input[type=range]{width:100%;background:var(--s1);border:1px solid var(--border);color:var(--text);padding:0.4rem;font-size:0.7rem;cursor:pointer}
.tweak-row input[type=color]{width:100%;height:32px;border:none;background:none;cursor:pointer}

/* SCROLL */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border)}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:6rem;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-style:italic}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* TASTE COLOR MAP */
.taste-甘口{--tc:#f5c842}
.taste-辛口{--tc:#90caf9}
.taste-酸味{--tc:#a8d8a8}
.taste-苦味{--tc:#e8547a}
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo-en">Cocktail Atlas</div>
    <div class="logo-ja">世界標準カクテル・データベース</div>
  </div>
  <div class="header-search">
    <span class="search-ico">🔍</span>
    <input id="searchInput" type="text" placeholder="カクテル名・材料・ベーススピリッツで検索...">
  </div>
  <div class="header-right">
    <div class="stat-badge">
      <strong id="totalCount">145</strong> 種のカクテル<br>
      <span>IBAオフィシャル + クラシック</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="表示設定">⚙</button>
  </div>
</header>

<div class="filters" id="filtersBar">
  <div class="filter-group">
    <span class="fgroup-label">ベース</span>
    <button class="fbtn active" data-filter="all">すべて</button>
    <button class="fbtn" data-filter="ウォッカ">ウォッカ</button>
    <button class="fbtn" data-filter="ジン">ジン</button>
    <button class="fbtn" data-filter="ラム">ラム</button>
    <button class="fbtn" data-filter="テキーラ">テキーラ</button>
    <button class="fbtn" data-filter="ウイスキー">ウイスキー</button>
    <button class="fbtn" data-filter="ブランデー">ブランデー</button>
    <button class="fbtn" data-filter="リキュール">リキュール</button>
    <button class="fbtn" data-filter="ワイン">ワイン/シェリー</button>
  </div>
  <div class="filter-group">
    <span class="fgroup-label">味わい</span>
    <button class="fbtn" data-taste="甘口">甘口</button>
    <button class="fbtn" data-taste="辛口">辛口</button>
    <button class="fbtn" data-taste="酸味">酸味</button>
    <button class="fbtn" data-taste="苦味">苦味</button>
  </div>
  <div class="filter-group">
    <span class="fgroup-label">カテゴリ</span>
    <button class="fbtn" data-era="クラシック">クラシック</button>
    <button class="fbtn" data-era="モダン">モダン</button>
    <button class="fbtn" data-iba="true">IBAのみ</button>
  </div>
</div>

<div class="toolbar">
  <div class="result-info"><strong id="resultCount">100</strong> 件表示中</div>
  <div class="view-btns">
    <button class="vbtn active" id="viewGrid" title="グリッド表示">▦</button>
    <button class="vbtn" id="viewList" title="リスト表示">☰</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕ 閉じる</button>
    <div id="modalInner"></div>
  </div>
</div>

<!-- TWEAKS -->
<div class="tweaks-panel" id="tweaksPanel">
  <div class="tweaks-title">Tweaks — 表示設定</div>
  <div class="tweak-row">
    <label class="tweak-label">アクセントカラー</label>
    <input type="color" id="twColor" value="#b4a06a">
  </div>
  <div class="tweak-row">
    <label class="tweak-label">カード密度</label>
    <select id="twDensity">
      <option value="280">標準 (3列〜)</option>
      <option value="220">コンパクト (4列〜)</option>
      <option value="360">ゆったり (2列〜)</option>
    </select>
  </div>
</div>

<script src="cocktail-data.js"></script>
<script>
const TWEAK_DEFAULTS = {accentColor:"#b4a06a", cardMinWidth:280};

// State
let filterBase = 'all', filterTaste = null, filterEra = null, filterIba = false;
let searchQ = '', viewMode = 'grid';
let tweaks = {...TWEAK_DEFAULTS};

// Glass SVG
function glasssvg(c, w=56, h=72) {
  const id = 'g'+Math.random().toString(36).slice(2,6);
  const c1=c.color1, c2=c.color2;
  const shapes = {
    'カクテルグラス': `<polygon points="8,6 ${w-8},6 ${w/2+5},${h-20} ${w/2-5},${h-20}" fill="url(#${id})"/>
      <line x1="${w/2}" y1="${h-20}" x2="${w/2}" y2="${h-4}" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <ellipse cx="${w/2}" cy="${h-4}" rx="${w/6}" ry="2" fill="rgba(255,255,255,0.12)"/>
      <polygon points="10,6 ${w-10},6 ${w/2+3},${h-22} ${w/2-3},${h-22}" fill="rgba(255,255,255,0.07)"/>`,
    'ハイボールグラス': `<rect x="${w*0.2}" y="8" width="${w*0.6}" height="${h-16}" rx="2" fill="url(#${id})"/>
      <rect x="${w*0.2}" y="8" width="${w*0.15}" height="${h-16}" rx="2" fill="rgba(255,255,255,0.09)"/>
      <rect x="${w*0.2}" y="8" width="${w*0.6}" height="3" fill="rgba(255,255,255,0.18)"/>`,
    'オールドファッションドグラス': `<rect x="${w*0.12}" y="${h*0.25}" width="${w*0.76}" height="${h*0.65}" rx="3" fill="url(#${id})"/>
      <rect x="${w*0.12}" y="${h*0.25}" width="${w*0.18}" height="${h*0.65}" rx="3" fill="rgba(255,255,255,0.09)"/>
      <rect x="${w*0.12}" y="${h*0.25}" width="${w*0.76}" height="4" fill="rgba(255,255,255,0.18)"/>`,
    'シャンパングラス': `<rect x="${w*0.32}" y="4" width="${w*0.36}" height="${h*0.68}" rx="3" fill="url(#${id})"/>
      <line x1="${w/2}" y1="${h*0.72}" x2="${w/2}" y2="${h-6}" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <ellipse cx="${w/2}" cy="${h-6}" rx="${w/6}" ry="2" fill="rgba(255,255,255,0.12)"/>
      <rect x="${w*0.34}" y="6" width="${w*0.08}" height="${h*0.65}" rx="2" fill="rgba(255,255,255,0.09)"/>`,
    'コリンズグラス': `<rect x="${w*0.26}" y="4" width="${w*0.48}" height="${h-10}" rx="2" fill="url(#${id})"/>
      <rect x="${w*0.26}" y="4" width="${w*0.12}" height="${h-10}" rx="2" fill="rgba(255,255,255,0.09)"/>
      <rect x="${w*0.26}" y="4" width="${w*0.48}" height="3" fill="rgba(255,255,255,0.18)"/>`,
    'マグカップ': `<rect x="${w*0.1}" y="${h*0.22}" width="${w*0.65}" height="${h*0.62}" rx="4" fill="url(#${id})"/>
      <path d="M${w*0.75},${h*0.32} Q${w*0.95},${h*0.32} ${w*0.95},${h*0.53} Q${w*0.95},${h*0.73} ${w*0.75},${h*0.73}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
      <rect x="${w*0.12}" y="${h*0.24}" width="${w*0.15}" height="${h*0.58}" rx="2" fill="rgba(255,255,255,0.09)"/>`,
    'ゴブレット': `<path d="M${w*0.12},${h*0.08} Q${w*0.12},${h*0.65} ${w/2},${h*0.65} Q${w*0.88},${h*0.65} ${w*0.88},${h*0.08} Z" fill="url(#${id})"/>
      <line x1="${w/2}" y1="${h*0.65}" x2="${w/2}" y2="${h-6}" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <ellipse cx="${w/2}" cy="${h-6}" rx="${w/6}" ry="2.5" fill="rgba(255,255,255,0.12)"/>`,
  };
  const shape = shapes[c.glass] || shapes['カクテルグラス'];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${c1}" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="${c2}" stop-opacity="0.72"/>
    </linearGradient></defs>
    ${shape}
  </svg>`;
}

// Flavor Radar
function radarSVG(f, size=170) {
  const cx=size/2, cy=size/2, r=(size/2)-28;
  const keys=['sweet','sour','bitter','strong','fresh','complex'];
  const labels=['甘さ','酸味','苦味','強さ','爽快感','複雑さ'];
  const n=keys.length, max=5;
  const angle=(i)=>(i/n)*Math.PI*2 - Math.PI/2;
  const pts=(ratio)=>keys.map((_,i)=>`${cx+r*ratio*Math.cos(angle(i))},${cy+r*ratio*Math.sin(angle(i))}`).join(' ');
  const datapts=keys.map((k,i)=>{
    const ratio=(f[k]||0)/max;
    return `${cx+r*ratio*Math.cos(angle(i))},${cy+r*ratio*Math.sin(angle(i))}`;
  }).join(' ');
  const grids=[0.2,0.4,0.6,0.8,1].map(l=>`<polygon points="${pts(l)}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`).join('');
  const axes=keys.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(angle(i))}" y2="${cy+r*Math.sin(angle(i))}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`).join('');
  const lbls=labels.map((l,i)=>{
    const lx=cx+(r+20)*Math.cos(angle(i)), ly=cy+(r+20)*Math.sin(angle(i));
    return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="rgba(180,160,106,0.7)" font-size="8.5" font-family="'Noto Serif JP',sans-serif">${l}</text>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${grids}${axes}
    <polygon points="${datapts}" fill="rgba(180,160,106,0.18)" stroke="#b4a06a" stroke-width="1.5"/>
    ${lbls}
  </svg>`;
}

// Flavor mini bar
function flavorBar(f){
  const d=[
    {k:'sweet',c:'#f5c842'},{k:'sour',c:'#a8d8a8'},{k:'bitter',c:'#e8547a'},
    {k:'strong',c:'#90caf9'},{k:'fresh',c:'#80cbc4'},{k:'complex',c:'#ce93d8'}
  ];
  return d.map(x=>`<div class="fbar" style="background:${x.c};flex:${(f[x.k]||0)*2+1}px" title="${x.k}:${f[x.k]}"></div>`).join('');
}

// Photo URL from ID folder using MD ID mapping
function photoUrl(c){
  const mdId = MD_ID_MAP[c.id];
  return mdId ? `ID/${mdId}.png` : null;
}

// Card render
function cardHTML(c, idx){
  const delay = Math.min(idx*25, 600);
  const fallback = `<div class="card-img-fallback" style="background:linear-gradient(135deg,${c.color1}22,${c.color2}44)">${glasssvg(c,60,76).replace(/"/g,"'")}</div>`;
  const url = photoUrl(c);
  const photo = url
    ? `<img src="${url}" alt="${c.name}" loading="lazy" onerror="this.outerHTML=this.dataset.fallback" data-fallback="${fallback.replace(/"/g,'&quot;')}">`
    : fallback;

  return `<div class="card" style="animation-delay:${delay}ms" data-id="${c.id}" onclick="openModal(${c.id})">
    <div class="card-img">${photo}</div>
    <div class="card-body">
      <div class="card-top">
        <span class="card-num">${String(c.id).padStart(3,'0')}</span>
        ${c.iba?'<span class="card-iba">IBA</span>':''}
      </div>
      <div class="card-name-wrap">
        <div class="card-name">${c.name}</div>
        <div class="card-nameja">${c.nameJa}</div>
      </div>
      <div class="card-tags">
        <span class="tag tag-base">${c.base}</span>
        <span class="tag tag-taste">${c.taste}</span>
        <span class="tag tag-era">${c.era}</span>
        <span class="card-abv" style="margin-left:auto"><strong>${c.abv}</strong>%</span>
      </div>
      <div class="flavor-bars">${flavorBar(c.flavor)}</div>
    </div>
  </div>`;
}

// Filter & Render
function getFiltered(){
  return COCKTAILS.filter(c=>{
    if(filterBase!=='all' && c.base!==filterBase) return false;
    if(filterTaste && c.taste!==filterTaste) return false;
    if(filterEra && c.era!==filterEra) return false;
    if(filterIba && !c.iba) return false;
    if(searchQ){
      const q=searchQ.toLowerCase();
      const inName=c.name.toLowerCase().includes(q)||c.nameJa.includes(q);
      const inBase=c.base.toLowerCase().includes(q);
      const inIngr=c.ingredients.some(([k])=>k.toLowerCase().includes(q));
      const inNote=(c.note||'').toLowerCase().includes(q);
      if(!inName&&!inBase&&!inIngr&&!inNote) return false;
    }
    return true;
  });
}

function render(){
  const list = getFiltered();
  document.getElementById('resultCount').textContent = list.length;
  const g = document.getElementById('grid');
  g.style.gridTemplateColumns = viewMode==='list' ? '1fr' : `repeat(auto-fill,minmax(${tweaks.cardMinWidth}px,1fr))`;
  if(!list.length){
    g.innerHTML = '<div class="empty">該当するカクテルが見つかりませんでした</div>';
    return;
  }
  g.innerHTML = list.map((c,i)=>cardHTML(c,i)).join('');
}

// Modal
function openModal(id){
  const c = COCKTAILS.find(x=>x.id===id);
  if(!c) return;
  const glass = glasssvg(c,90,114);
  const heroFallback = `<div style="background:linear-gradient(135deg,${c.color1}44,${c.color2}88,#09080b);width:100%;height:100%;display:flex;align-items:center;justify-content:center"><div style="position:relative;z-index:2">${glass.replace(/"/g,"'")}</div></div>`;
  document.getElementById('modalInner').innerHTML = `
    <div class="modal-hero">
      ${photoUrl(c)
  ? `<img src="${photoUrl(c)}" alt="${c.name}" style="width:100%;height:100%;object-fit:contain" onerror="this.outerHTML=this.dataset.fallback" data-fallback="${heroFallback.replace(/"/g,'&quot;')}">`
  : heroFallback.replace(/"/g,"'")}
      <div class="modal-hero-overlay"></div>
    </div>
    <div class="modal-body">
      <button class="modal-close" onclick="closeModal()">✕ 閉じる</button>
      <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
        <h2 class="modal-title">${c.name}</h2>
        ${c.iba?'<span class="card-iba">IBAオフィシャル</span>':''}
      </div>
      <p class="modal-subtitle">${c.nameJa}　·　${c.base}　·　${c.glass}　·　ABV ${c.abv}%　·　${c.era}</p>

      <div class="modal-grid">
        <div>
          <p class="section-label">材料 — Ingredients</p>
          <ul class="ingr-list">
            ${c.ingredients.map(([k,v])=>`<li><span>${k}</span><span>${v}</span></li>`).join('')}
          </ul>

          <p class="section-label">作り方 — Method</p>
          <p class="method-text">${c.method}</p>

          ${c.note?`<p class="section-label">背景 — Story</p><p class="note-text">${c.note}</p>`:''}

          <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
            <span class="tag tag-base">${c.base}</span>
            <span class="tag tag-taste">${c.taste}</span>
            <span class="tag tag-era">${c.era}</span>
          </div>
        </div>

        <div>
          <p class="section-label">フレーバー</p>
          <div class="flavor-wheel-wrap">
            ${radarSVG(c.flavor,170)}
            <ul class="flavor-legend">
              ${[['甘さ','sweet'],['酸味','sour'],['苦味','bitter'],['強さ','strong'],['爽快感','fresh'],['複雑さ','complex']].map(([l,k])=>`<li><span>${l}</span><span>${'●'.repeat(c.flavor[k]||0)}${'○'.repeat(5-(c.flavor[k]||0))}</span></li>`).join('')}
            </ul>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modal').scrollTop = 0;
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalBg').onclick = e=>{ if(e.target===e.currentTarget) closeModal(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

// Filter events
document.querySelectorAll('[data-filter]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    filterBase=b.dataset.filter;
    render();
  });
});
document.querySelectorAll('[data-taste]').forEach(b=>{
  b.addEventListener('click',()=>{
    if(b.classList.contains('active')){ b.classList.remove('active'); filterTaste=null; }
    else{ document.querySelectorAll('[data-taste]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); filterTaste=b.dataset.taste; }
    render();
  });
});
document.querySelectorAll('[data-era]').forEach(b=>{
  b.addEventListener('click',()=>{
    if(b.classList.contains('active')){ b.classList.remove('active'); filterEra=null; }
    else{ document.querySelectorAll('[data-era]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); filterEra=b.dataset.era; }
    render();
  });
});
document.querySelector('[data-iba]').addEventListener('click',()=>{
  const btn=document.querySelector('[data-iba]');
  filterIba=!btn.classList.contains('active');
  btn.classList.toggle('active',filterIba);
  render();
});
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value.trim();
  render();
});

// View mode
document.getElementById('viewGrid').onclick=()=>{
  viewMode='grid';
  document.getElementById('grid').classList.remove('view-list');
  document.getElementById('viewGrid').classList.add('active');
  document.getElementById('viewList').classList.remove('active');
  render();
};
document.getElementById('viewList').onclick=()=>{
  viewMode='list';
  document.getElementById('grid').classList.add('view-list');
  document.getElementById('viewList').classList.add('active');
  document.getElementById('viewGrid').classList.remove('active');
  render();
};

// Settings toggle
document.getElementById('settingsBtn').addEventListener('click',()=>{
  const panel = document.getElementById('tweaksPanel');
  const btn = document.getElementById('settingsBtn');
  const isOpen = panel.style.display === 'block';
  panel.style.display = isOpen ? 'none' : 'block';
  btn.classList.toggle('active', !isOpen);
});

// Tweaks
function applyTweaks(){
  document.documentElement.style.setProperty('--gold', tweaks.accentColor);
  document.documentElement.style.setProperty('--gold2', tweaks.accentColor);
  render();
}
document.getElementById('twColor').value = tweaks.accentColor;
document.getElementById('twColor').addEventListener('input',e=>{
  tweaks.accentColor=e.target.value;
  applyTweaks();
});
document.getElementById('twDensity').addEventListener('change',e=>{
  tweaks.cardMinWidth=parseInt(e.target.value);
  render();
});

applyTweaks();
</script>
